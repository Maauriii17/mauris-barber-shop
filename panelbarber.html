<!DOCTYPE html>
<html>

<head>

    <title>Panel barber</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <a href="/">Inici</a>

</nav>

<div class="caixa">

<h1>Reserves</h1>

{% if cites|length == 0 %}

<p>No tens reserves encara.</p>

{% endif %}

{% for c in cites %}

<div class="cita">

    <h3>{{ c.title }}</h3>

    <p><b>Servei:</b> {{ c.service }}</p>

    <p><b>Data i hora:</b> {{ c.start }}</p>

</div>

{% endfor %}

</div>

</body>
</html>
