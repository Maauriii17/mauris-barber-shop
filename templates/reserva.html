<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservar cita - Mauri's Barber Shop</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>
    <div class="logo">MAURI'S BARBER SHOP</div>

    <div class="nav-links">
        <a href="/">Inici</a>
        <a href="/reserva">Reservar</a>
        <a href="/logout">Sortir</a>
    </div>
</nav>


<section class="reserva-section">

    <div class="reserva-card">

        <p class="petit-titol">RESERVA ONLINE</p>

        <h1>Reserva la teva cita</h1>

        <p class="reserva-text">
            Tria el servei, selecciona el dia i consulta les hores disponibles.
        </p>


        <div class="formulari-reserva">

            <label for="nom">Nom</label>

            <input
                type="text"
                id="nom"
                placeholder="Escriu el teu nom"
            >


            <label for="servei">Servei</label>

            <select id="servei">

                <option value="">
                    Selecciona un servei
                </option>

                {% for servei, preu in serveis.items() %}

                    <option value="{{ servei }}">
                        {{ servei }} - {{ preu }} €
                    </option>

                {% endfor %}

            </select>


            <label for="dia">Dia</label>

            <input
                type="date"
                id="dia"
            >

        </div>


        <div class="hores-container">

            <h2>Hores disponibles</h2>

            <p id="missatge-dia">
                Selecciona un dia per veure les hores disponibles.
            </p>

            <div id="hores" class="hores-grid"></div>

        </div>


        <div id="resultat-reserva"></div>

    </div>

</section>


<script>

let horaSeleccionada = null;

const diaInput = document.getElementById("dia");
const horesDiv = document.getElementById("hores");
const resultat = document.getElementById("resultat-reserva");
const missatgeDia = document.getElementById("missatge-dia");


const avui = new Date();

const any = avui.getFullYear();

const mes = String(
    avui.getMonth() + 1
).padStart(2, "0");

const diaActual = String(
    avui.getDate()
).padStart(2, "0");

diaInput.min = `${any}-${mes}-${diaActual}`;

diaInput.addEventListener(
    "change",
    carregarHores
);


function carregarHores() {

    const diaSeleccionat = diaInput.value;

    horaSeleccionada = null;
    horesDiv.innerHTML = "";

    if (!diaSeleccionat) {

        missatgeDia.style.display = "block";

        missatgeDia.textContent =
            "Selecciona un dia per veure les hores disponibles.";

        return;
    }


    fetch(`/api/hores/${diaSeleccionat}`)

        .then(response => response.json())

        .then(hores => {

            horesDiv.innerHTML = "";

            if (hores.length === 0) {

                missatgeDia.style.display = "block";

                missatgeDia.textContent =
                    "Aquest dia no té hores disponibles.";

                return;
            }

            missatgeDia.style.display = "none";


            hores.forEach(element => {

                const boto =
                    document.createElement("button");


                if (element.passada) {

                    boto.textContent =
                        element.hora + " · Passada";

                    boto.disabled = true;

                    boto.classList.add(
                        "hora-ocupada"
                    );

                }

                else if (element.ocupada) {

                    boto.textContent =
                        element.hora + " · Ocupada";

                    boto.disabled = true;

                    boto.classList.add(
                        "hora-ocupada"
                    );

                }

                else {

                    boto.textContent =
                        element.hora;

                    boto.classList.add(
                        "hora-disponible"
                    );

                    boto.addEventListener(
                        "click",
                        function () {

                            document
                                .querySelectorAll(".hora-disponible")
                                .forEach(
                                    b =>
                                        b.classList.remove(
                                            "hora-seleccionada"
                                        )
                                );

                            boto.classList.add(
                                "hora-seleccionada"
                            );

                            horaSeleccionada =
                                element.hora;

                        }
                    );

                }

                horesDiv.appendChild(boto);

            });


            const confirmar =
                document.createElement("button");

            confirmar.textContent =
                "Confirmar reserva";

            confirmar.classList.add(
                "boto-principal",
                "confirmar-reserva"
            );

            confirmar.addEventListener(
                "click",
                confirmarReserva
            );

            horesDiv.appendChild(confirmar);

        });

}


function confirmarReserva() {

    const nom =
        document
            .getElementById("nom")
            .value
            .trim();

    const servei =
        document
            .getElementById("servei")
            .value;

    const dia =
        document
            .getElementById("dia")
            .value;

    resultat.innerHTML = "";


    if (
        !nom ||
        !servei ||
        !dia ||
        !horaSeleccionada
    ) {

        resultat.innerHTML =
            "<p class='missatge-error'>Completa totes les dades i selecciona una hora disponible.</p>";

        return;
    }


    fetch("/api/reservar", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            nom: nom,
            servei: servei,
            dia: dia,
            hora: horaSeleccionada
        })

    })

    .then(response => response.json())

    .then(data => {

        if (data.ok) {

            resultat.innerHTML =
                `<div class="reserva-correcta">

                    <h3>Reserva confirmada</h3>

                    <p>
                        <strong>Nom:</strong>
                        ${nom}
                    </p>

                    <p>
                        <strong>Servei:</strong>
                        ${servei}
                    </p>

                    <p>
                        <strong>Data:</strong>
                        ${dia}
                    </p>

                    <p>
                        <strong>Hora:</strong>
                        ${horaSeleccionada}
                    </p>

                </div>`;

            horaSeleccionada = null;

            carregarHores();

        }

        else {

            let text =
                data.missatge;


            if (
                data.suggeriments &&
                data.suggeriments.length > 0
            ) {

                text +=
                    "<br><br>Et proposem aquestes hores: ";

                text +=
                    data.suggeriments.join(", ");

            }

            resultat.innerHTML =
                `<p class="missatge-error">
                    ${text}
                </p>`;

            carregarHores();

        }

    });

}

</script>

</body>
</html>
